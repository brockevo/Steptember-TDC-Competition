name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The scheduled refresh commits using the default GITHUB_TOKEN, and GitHub
  # deliberately does not start workflows from such pushes — otherwise a
  # workflow could trigger itself forever. Without this trigger the new figures
  # land in the repo but never reach the site.
  workflow_run:
    workflows: ['Refresh Steptember data']
    types: [completed]
  workflow_dispatch:

# Allow one deployment at a time; let a running one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A failed refresh commits nothing, so there is nothing new to publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A workflow_run event starts from the commit that triggered the
          # refresh, which predates the commit holding the new figures.
          ref: main

      - uses: actions/configure-pages@v5

      # Pages serves everything with max-age=600 and no content hashing, so for
      # ten minutes after a deploy a browser can pair fresh HTML with a cached
      # script. Stamping the commit onto every asset URL means an index.html can
      # only ever load the exact files it shipped with. This edits the checked
      # out copy that gets uploaded, never the committed source.
      - name: Stamp asset URLs with the commit SHA
        run: |
          set -euo pipefail
          # Take the SHA of what was actually checked out: on a workflow_run
          # event GITHUB_SHA points at the older triggering commit.
          V="$(git rev-parse --short=12 HEAD)"

          # '#' as the delimiter: the alternation below contains '|'.
          sed -i -E "s#(assets/(css/styles\.css|js/app\.js))\"#\1?v=$V\"#g" index.html

          # The entry point alone isn't enough: app.js?v=NEW importing a bare
          # './data.js' would still be served from cache.
          find assets/js -name '*.js' -print0 \
            | xargs -0 sed -i -E "s#(from '\./[A-Za-z0-9_-]+\.js)'#\1?v=$V'#g"

          # Fail loudly rather than deploying a silently unstamped build.
          grep -q "js/app\.js?v=$V" index.html || { echo "index.html was not stamped"; exit 1; }
          grep -q "styles\.css?v=$V" index.html || { echo "stylesheet was not stamped"; exit 1; }
          if grep -rn "from '\./[A-Za-z0-9_-]*\.js'" assets/js/; then
            echo "the imports above were not stamped"; exit 1
          fi

          echo "Stamped with $V:"
          grep -nE "assets/(css|js)/" index.html
          grep -rnE "from '\./" assets/js/

      # The site is plain HTML/CSS/JS — the repo root is the artifact, no build.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
