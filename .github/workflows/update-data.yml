name: Refresh Steptember data

on:
  schedule:
    # Every two hours. The job only commits when a number actually changed,
    # so a tighter schedule costs a scrape, not a stream of empty commits.
    - cron: '0 */2 * * *'
  workflow_dispatch:

# Never let two refreshes race each other onto the same branch.
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The script leaves committed figures untouched for any team it cannot
      # read, and only fails the job if every team was unreachable.
      - name: Scrape the team pages
        run: node scripts/fetch-steptember.mjs

      # The org leaderboard needs a session and its login is client-rendered,
      # so this half needs a real browser where the team pages did not.
      # --no-save because the repo has no package.json and wants none: this is a
      # build-time tool for one step, not a dependency of the site, which stays
      # dependency-free. The commit step only ever stages data/, so the
      # node_modules this creates is never committed.
      - name: Install a browser for the leaderboard scrape
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
        continue-on-error: true

      # continue-on-error on both steps: the placements are a garnish, and a
      # rejected login or a moved selector must never cost us the step and
      # donation refresh, which is what the site actually runs on. The script
      # leaves the committed placements untouched whenever it cannot read them.
      - name: Read our placements across TDC
        run: node scripts/fetch-org-leaderboard.mjs
        continue-on-error: true
        env:
          STEPTEMBER_EMAIL: ${{ secrets.STEPTEMBER_EMAIL }}
          STEPTEMBER_PASSWORD: ${{ secrets.STEPTEMBER_PASSWORD }}

      - name: Commit any changes
        run: |
          if git diff --quiet -- data/; then
            echo "No change in the numbers — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Refresh Steptember figures"
          git push
